name: Export repository source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: zip -r /tmp/iWinDoorDemo-Enzo-source.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: iWinDoorDemo-Enzo-source
          path: /tmp/iWinDoorDemo-Enzo-source.zip
