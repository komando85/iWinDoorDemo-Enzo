name: Export project files
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p /tmp/export
          cp 'لاگ 5.36.zip' /tmp/export/
          cp 'اطلاعات بازار.zip' /tmp/export/
          cp 'مرجع.zip' /tmp/export/
      - uses: actions/upload-artifact@v4
        with:
          name: project-zips
          path: /tmp/export
