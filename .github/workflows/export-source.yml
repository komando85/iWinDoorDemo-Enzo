name: Export repository source
on:
  push:
    branches: [tmp-build-537]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive
        run: |
          zip -r /tmp/iWinDoorDemo-Enzo-source.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: iWinDoorDemo-Enzo-source
          path: /tmp/iWinDoorDemo-Enzo-source.zip
