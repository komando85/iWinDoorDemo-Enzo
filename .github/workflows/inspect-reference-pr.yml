name: Inspect reference ZIP on PR

on:
  pull_request:
    branches:
      - main

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reference
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z = Path("مرجع.zip")
          out = Path("ref_unpacked")
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(z) as f:
              f.extractall(out)
          print("UNPACKED FILES:")
          for p in sorted(out.rglob("*")):
              if p.is_file():
                  print(p.as_posix(), p.stat().st_size)
          PY
      - name: Upload unpacked reference
        uses: actions/upload-artifact@v4
        with:
          name: ref-unpacked-v521
          path: ref_unpacked/
          if-no-files-found: error
