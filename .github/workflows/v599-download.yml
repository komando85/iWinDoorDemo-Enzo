name: V5.99 Download Artifact
on:
  push:
    branches:
      - "work/v5.99-build"
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload V5.99
        uses: actions/upload-artifact@v4
        with:
          name: Experts_V5.99
          path: Experts_V5.99.zip
          if-no-files-found: error
