name: Export original audit data
on:
  pull_request:
    branches:
      - main
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ORIGINAL_EXPERTS_ARCHIVE
          path: Experts.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_TRUTH_ARCHIVE
          path: "اطلاعات بازار.zip"
          if-no-files-found: error
