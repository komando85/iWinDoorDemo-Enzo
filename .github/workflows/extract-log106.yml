name: extract-log106
on:
  push:
    branches:
      - analysis/log106
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract log archive
        run: |
          rm -rf extracted106
          mkdir -p extracted106
          unzip -q "لاگ 5106.zip" -d extracted106
          find extracted106 -type f -maxdepth 5 -print
      - name: Upload extracted log
        uses: actions/upload-artifact@v4
        with:
          name: log106-extracted
          path: extracted106
          if-no-files-found: error
