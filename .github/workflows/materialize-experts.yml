name: build-v568
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V5.68
        run: python build_v568.py
      - name: Upload V5.68 package
        uses: actions/upload-artifact@v4
        with:
          name: TFlab_Experts_V5.68
          path: TFlab_Experts_V5.68.zip
          if-no-files-found: error
