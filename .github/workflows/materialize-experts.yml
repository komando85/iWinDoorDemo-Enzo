name: materialize-experts
on:
  push:
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Experts with Python
        shell: python
        run: |
          import zipfile, pathlib
          root=pathlib.Path('.')
          with zipfile.ZipFile('Experts.zip') as z:
              z.extractall(root)
          print("materialized reference files")
      - name: Commit materialized files
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ربات مرجع"
          git status --short
          git commit -m "Materialize reference Experts files for V5.68 fix" || true
          git push
