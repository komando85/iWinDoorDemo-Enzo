name: inspect-v568-source
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect direction block
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('Experts.zip') as z:
              def lines(n): return z.read(n).decode('utf-8-sig',errors='replace').splitlines()
              main=lines('ربات مرجع/TFlab New EA V.5.mq5')
              for a,b in [(3780,4040),(4400,4660),(1800,2025),(9600,9900)]:
                  print(f"\n===== MAIN {a}-{b} =====")
                  print("\n".join(f"{i+1}: {main[i]}" for i in range(a-1,min(b,len(main)))))
              strat=lines('ربات مرجع/Strategy_Engine.mqh')
              for a,b in [(1,220),(1030,1660)]:
                  print(f"\n===== STRATEGY {a}-{b} =====")
                  print("\n".join(f"{i+1}: {strat[i]}" for i in range(a-1,min(b,len(strat)))))
