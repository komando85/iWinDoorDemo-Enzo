name: inspect-v568-truth
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Market Truth
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('Experts.zip') as z:
              def dump(name, ranges):
                  lines=z.read(name).decode('utf-8-sig',errors='replace').splitlines()
                  print("\n===== "+name+" =====")
                  for a,b in ranges:
                      print(f"--- {a}-{b} ---")
                      print("\n".join(f"{i+1}: {lines[i]}" for i in range(a-1,min(b,len(lines)))))
              dump('ربات مرجع/Market_Truth_Engine.mqh',[(1,220),(220,520),(520,900)])
              dump('ربات مرجع/TFlab New EA V.5.mq5',[(3300,3785),(3900,4060),(4060,4360)])
