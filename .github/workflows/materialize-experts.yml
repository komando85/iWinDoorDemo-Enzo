name: inspect-v568-truth-use
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect truth population and locks
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('Experts.zip') as z:
              lines=z.read('ربات مرجع/TFlab New EA V.5.mq5').decode('utf-8-sig',errors='replace').splitlines()
              for a,b in [(2900,3320),(1470,1535),(1580,1695),(3960,4055)]:
                  print(f"\n===== MAIN {a}-{b} =====")
                  print("\n".join(f"{i+1}: {lines[i]}" for i in range(a-1,min(b,len(lines)))))
              t=z.read('ربات مرجع/Market_Truth_Engine.mqh').decode('utf-8-sig',errors='replace').splitlines()
              for a,b in [(280,390)]:
                  print(f"\n===== TRUTH {a}-{b} =====")
                  print("\n".join(f"{i+1}: {t[i]}" for i in range(a-1,min(b,len(t)))))
