name: inspect-v568-reading
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reading and candidate scores
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('Experts.zip') as z:
              for n,ranges in [
                ('ربات مرجع/Market_Reading_Engine.mqh',[(1,520)]),
                ('ربات مرجع/Market_Context.mqh',[(1,450)]),
                ('ربات مرجع/Market_Regime.mqh',[(1,420)]),
                ('ربات مرجع/Market_Structure.mqh',[(1,520)])
              ]:
                  lines=z.read(n).decode('utf-8-sig',errors='replace').splitlines()
                  print(f"\n===== {n} =====")
                  for a,b in ranges:
                      for i in range(a-1,min(b,len(lines))):
                          if any(k in lines[i] for k in ['Direction','direction','bias','state','trend','bullish','bearish','score','current_price','recent','M5']):
                              print(f"{i+1}: {lines[i]}")
