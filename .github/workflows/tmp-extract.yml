name: tmp-extract-reference
on:
  push:
    branches:
      - tmp-v538-build
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reference
        run: |
          rm -rf out
          mkdir -p out
          unzip -q "مرجع.zip" -d out
          echo "FILES:"
          find out -type f | sort
      - name: Upload extracted reference
        uses: actions/upload-artifact@v4
        with:
          name: v538-reference-source
          path: out
