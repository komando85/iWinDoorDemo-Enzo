name: Materialize V5.81 analysis sources

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V5.81 log
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _materialized
          mkdir -p _materialized
          unzip -q "لاگ 5.81.zip" -d "_materialized/log581"
          find _materialized/log581 -type f | sort > _materialized/filelist.txt
      - name: Package extracted log
        shell: bash
        run: |
          set -euo pipefail
          cd _materialized
          zip -qr ../v581-materialized-log.zip log581 filelist.txt
      - name: Upload extracted V5.81 log
        uses: actions/upload-artifact@v4
        with:
          name: v581-materialized-log
          path: v581-materialized-log.zip
          if-no-files-found: error
