name: extract-log599

on:
  push:
    branches:
      - analysis/log599

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract log archive
        run: |
          rm -rf extracted599
          mkdir -p extracted599
          unzip -q "لاگ 5.99.zip" -d extracted599
          find extracted599 -type f -maxdepth 5 -print
      - name: Upload extracted log
        uses: actions/upload-artifact@v4
        with:
          name: log599-extracted
          path: extracted599
          if-no-files-found: error
