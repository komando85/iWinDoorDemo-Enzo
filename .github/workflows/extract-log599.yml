name: extract-log599

on:
  push:
    branches:
      - analysis/log599

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract log archive
        run: |
          rm -rf extracted599
          mkdir -p extracted599
          unzip -q "لاگ 5.99.zip" -d extracted599
          echo "=== LOG FILES ==="
          find extracted599 -type f -maxdepth 5 -print
      - name: Extract Experts archive
        run: |
          rm -rf experts599
          mkdir -p experts599
          unzip -q Experts.zip -d experts599
          echo "=== EXPERT FILES ==="
          find experts599 -type f -maxdepth 5 -print
      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: log599-and-experts-extracted
          path: |
            extracted599
            experts599
          if-no-files-found: error
